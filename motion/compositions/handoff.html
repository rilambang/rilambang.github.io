<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1440px; height: 500px; overflow: hidden; background: #fcf2f4; }
  #root { position: relative; width: 1440px; height: 500px; }
  .box { fill: #fcf2f4; stroke: #2b0e18; stroke-width: 3; }
  .box.acc { stroke: #a31d47; }
  .tx { fill: #2b0e18; font: 500 30px Inter, sans-serif; }
  .tx.sm { font-size: 24px; fill: #6a4250; }
  .tx.acc { fill: #a31d47; }
  .arrow { fill: none; stroke: #a31d47; stroke-width: 4; stroke-linecap: round; }
  .head { fill: #a31d47; }
  .tick { fill: none; stroke: #a31d47; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="root" data-composition-id="handoff" data-start="0" data-duration="5.2" data-width="1440" data-height="500">
  <svg viewBox="0 0 1440 500" width="1440" height="500">
    <g id="web">
      <rect x="60" y="180" width="280" height="140" rx="14" class="box" />
      <text x="200" y="242" text-anchor="middle" class="tx">Web sign-in</text>
      <text x="200" y="282" text-anchor="middle" class="tx sm">the hand-off link</text>
    </g>

    <g id="app">
      <rect x="440" y="180" width="280" height="140" rx="14" class="box" />
      <text x="580" y="262" text-anchor="middle" class="tx">App</text>
    </g>

    <g id="cover">
      <rect x="454" y="194" width="252" height="112" rx="10" class="box acc" />
      <text id="cover-tx" x="580" y="248" text-anchor="middle" class="tx sm">Syncing account</text>
      <path id="cover-tick" d="M550 274 l 16 14 l 34 -34" pathLength="1" class="tick" />
    </g>

    <g id="same">
      <rect x="900" y="96" width="380" height="116" rx="14" class="box" />
      <text x="1090" y="144" text-anchor="middle" class="tx">Same student</text>
      <text x="1090" y="180" text-anchor="middle" class="tx sm">straight in</text>
    </g>
    <g id="other">
      <rect x="900" y="288" width="380" height="116" rx="14" class="box acc" />
      <text x="1090" y="336" text-anchor="middle" class="tx">Different student</text>
      <text x="1090" y="372" text-anchor="middle" class="tx sm acc">Login</text>
    </g>

    <g id="a1">
      <line x1="344" y1="250" x2="424" y2="250" pathLength="1" class="arrow" />
      <polygon points="440,250 420,240 420,260" class="head" />
    </g>
    <g id="a2">
      <line x1="724" y1="238" x2="876" y2="172" pathLength="1" class="arrow" />
      <g transform="translate(884,168) rotate(-26.6)"><polygon points="0,0 -20,-8 -20,8" class="head" /></g>
    </g>
    <g id="a3">
      <line x1="724" y1="262" x2="876" y2="328" pathLength="1" class="arrow" />
      <g transform="translate(884,332) rotate(26.6)"><polygon points="0,0 -20,-8 -20,8" class="head" /></g>
    </g>

  </svg>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#web', { opacity: 0, scale: 0.94, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power4.out' }, 0.1);
  tl.fromTo('#a1 line', { attr: { 'stroke-dashoffset': 1 }, strokeDasharray: 1 }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.45, ease: 'power2.inOut' }, 0.55);
  tl.fromTo('#a1 polygon', { opacity: 0 }, { opacity: 1, duration: 0.12 }, 0.95);
  tl.fromTo('#app', { opacity: 0, scale: 0.94, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power4.out' }, 0.95);
  tl.fromTo('#cover', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 1.3);
  tl.fromTo('#cover-tick', { attr: { 'stroke-dashoffset': 1 }, strokeDasharray: 1 }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.4, ease: 'power2.out' }, 1.8);
  tl.fromTo('#a2 line, #a3 line', { attr: { 'stroke-dashoffset': 1 }, strokeDasharray: 1 }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.45, ease: 'power2.inOut', stagger: 0.12 }, 2.3);
  tl.fromTo('#a2 g, #a3 g', { opacity: 0 }, { opacity: 1, duration: 0.14, stagger: 0.12 }, 2.7);
  tl.fromTo('#same', { opacity: 0, scale: 0.94, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.45, ease: 'power4.out' }, 2.75);
  tl.fromTo('#other', { opacity: 0, scale: 0.94, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.45, ease: 'power4.out' }, 2.9);
  window.__timelines['handoff'] = tl;
</script>
</body>
</html>
